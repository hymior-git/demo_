name: NotificationApp
options:
  bundleIdPrefix: com.investing
  deploymentTarget:
    iOS: "16.0"
  createSharedSchemes: true
targets:
  NotificationApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ios_native_project
        excludes:
          - "Info.plist"
    info:
      path: ios_native_project/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.investing.customnotifications
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: YES
      AD_HOC_CODE_SIGNING_ALLOWED: YES
