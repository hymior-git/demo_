name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App with Xcode
        run: |
          set +e
          xcodebuild clean build \
            -project NotificationApp.xcodeproj \
            -target NotificationApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES > build.log 2>&1
          BUILD_STATUS=$?
          echo "=== XCODEBUILD EXIT CODE: $BUILD_STATUS ==="
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "=== BUILD ERRORS FOUND ==="
            tail -n 100 build.log
            exit 1
          fi

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Package Payload to IPA
        run: |
          APP_PATH=$(find ./DerivedData -name "NotificationApp.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          cp investing_icon.jpg Payload/NotificationApp.app/AppIcon.png || true
          zip -r NotificationApp.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotificationApp-iOS-IPA
          path: NotificationApp.ipa
